<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ancient Odyssey: The Platform Quest</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            margin: 0;
            padding: 0;
            background: #0f172a;
            color: #fff;
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            min-height: 100vh;
            overflow: hidden;
        }

        .game-wrapper {
            position: relative;
            width: 100%;
            max-width: 450px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .hud {
            width: 100%;
            padding: 12px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(15, 23, 42, 0.95);
            border-bottom: 2px solid rgba(255, 255, 255, 0.1);
            font-weight: bold;
            font-size: 16px;
            z-index: 10;
        }

        canvas {
            display: block;
            width: 100%;
            height: auto;
            background: #1e293b;
        }

        /* Touch Controls Area */
        .controls-container {
            width: 100%;
            max-width: 450px;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #090d16;
            margin-bottom: 10px;
        }

        .d-pad {
            display: flex;
            gap: 15px;
        }

        .btn {
            background: #334155;
            color: #fff;
            border: 2px solid #64748b;
            font-size: 24px;
            font-weight: bold;
            width: 70px;
            height: 70px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            cursor: pointer;
        }

        .btn:active, .btn.active {
            background: #f59e0b;
            color: #000;
            transform: scale(0.92);
        }

        .btn-jump {
            width: 80px;
            height: 80px;
            background: #dc2626;
            border-color: #ef4444;
            border-radius: 20px;
        }

        .btn-jump:active, .btn-jump.active {
            background: #22c55e;
            border-color: #4ade80;
        }
    </style>
</head>
<body>

    <div class="game-wrapper">
        <div class="hud">
            <span id="scoreTxt">النقاط: 0</span>
            <span id="livesTxt">الأرواح: ❤️❤️❤️</span>
        </div>
        <canvas id="gameCanvas" width="400" height="350"></canvas>
    </div>

    <div class="controls-container">
        <div class="d-pad">
            <div class="btn" id="btnLeft">⬅️</div>
            <div class="btn" id="btnRight">➡️</div>
        </div>
        <div class="btn btn-jump" id="btnJump">⬆️</div>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        let score = 0;
        let lives = 3;

        let player = {
            x: 50, y: 150,
            width: 24, height: 36,
            vx: 0, vy: 0,
            speed: 3.5,
            jumpPower: -10,
            gravity: 0.5,
            grounded: false
        };

        let platforms = [
            { x: 0, y: 310, width: 400, height: 40 },
            { x: 40, y: 230, width: 110, height: 15 },
            { x: 210, y: 180, width: 130, height: 15 },
            { x: 70, y: 120, width: 100, height: 15 }
        ];

        let coins = [
            { x: 90, y: 190, collected: false },
            { x: 270, y: 140, collected: false },
            { x: 110, y: 80, collected: false }
        ];

        let keys = { left: false, right: false, jump: false };

        // Fixed Touch Controls Listener
        function setupButton(id, keyName) {
            const btn = document.getElementById(id);
            
            ['touchstart', 'mousedown'].forEach(evt => {
                btn.addEventListener(evt, (e) => {
                    e.preventDefault();
                    keys[keyName] = true;
                    btn.classList.add('active');
                }, { passive: false });
            });

            ['touchend', 'mouseup', 'mouseleave'].forEach(evt => {
                btn.addEventListener(evt, (e) => {
                    e.preventDefault();
                    keys[keyName] = false;
                    btn.classList.remove('active');
                }, { passive: false });
            });
        }

        setupButton('btnLeft', 'left');
        setupButton('btnRight', 'right');
        setupButton('btnJump', 'jump');

        function update() {
            if (keys.left) player.vx = -player.speed;
            else if (keys.right) player.vx = player.speed;
            else player.vx = 0;

            if (keys.jump && player.grounded) {
                player.vy = player.jumpPower;
                player.grounded = false;
            }

            player.vy += player.gravity;
            player.x += player.vx;
            player.y += player.vy;

            player.grounded = false;

            platforms.forEach(p => {
                if (
                    player.x < p.x + p.width &&
                    player.x + player.width > p.x &&
                    player.y + player.height > p.y &&
                    player.y + player.height < p.y + p.vy + 12
                ) {
                    player.y = p.y - player.height;
                    player.vy = 0;
                    player.grounded = true;
                }
            });

            if (player.x < 0) player.x = 0;
            if (player.x > canvas.width - player.width) player.x = canvas.width - player.width;

            if (player.y > canvas.height) {
                lives--;
                player.x = 50; player.y = 150; player.vy = 0;
                if (lives <= 0) { score = 0; lives = 3; coins.forEach(c => c.collected = false); }
            }

            coins.forEach(c => {
                if (!c.collected && Math.abs(player.x - c.x) < 22 && Math.abs(player.y - c.y) < 22) {
                    c.collected = true;
                    score += 100;
                }
            });

            document.getElementById('scoreTxt').innerText = `النقاط: ${score}`;
            document.getElementById('livesTxt').innerText = `الأرواح: ${'❤️'.repeat(lives)}`;
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw Platforms
            platforms.forEach(p => {
                ctx.fillStyle = "#475569";
                ctx.fillRect(p.x, p.y, p.width, p.height);
                ctx.fillStyle = "#64748b";
                ctx.fillRect(p.x, p.y, p.width, 3);
            });

            // Draw Coins
            coins.forEach(c => {
                if (!c.collected) {
                    ctx.beginPath();
                    ctx.arc(c.x, c.y, 8, 0, Math.PI * 2);
                    ctx.fillStyle = "#f59e0b";
                    ctx.fill();
                }
            });

            // Draw Player
            ctx.fillStyle = "#dc2626";
            ctx.fillRect(player.x, player.y, player.width, player.height);
            ctx.fillStyle = "#fde68a";
            ctx.fillRect(player.x + 4, player.y + 4, player.width - 8, 10);
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        loop();
    </script>
</body>
</html>

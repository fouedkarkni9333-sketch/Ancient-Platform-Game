<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ancient Odyssey: The Platform Quest</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        body {
            margin: 0;
            padding: 0;
            background: #0f172a;
            color: #fff;
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            min-height: 100vh;
            overflow: hidden;
        }

        /* Container & HUD */
        .game-wrapper {
            position: relative;
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .hud {
            width: 100%;
            padding: 10px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(15, 23, 42, 0.9);
            border-bottom: 2px solid rgba(255, 255, 255, 0.1);
            font-weight: bold;
            font-size: 16px;
            z-index: 10;
        }

        canvas {
            display: block;
            width: 100%;
            height: auto;
            background: #1e293b;
            border-bottom: 2px solid rgba(255, 255, 255, 0.1);
        }

        /* Touch Controls Area */
        .controls-container {
            width: 100%;
            max-width: 500px;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #090d16;
        }

        .d-pad {
            display: flex;
            gap: 15px;
        }

        .btn {
            background: #334155;
            color: #fff;
            border: 2px solid #64748b;
            font-size: 24px;
            font-weight: bold;
            width: 65px;
            height: 65px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            transition: background 0.1s, transform 0.1s;
        }

        .btn:active {
            background: #f59e0b;
            color: #000;
            transform: scale(0.92);
        }

        .btn-jump {
            width: 75px;
            height: 75px;
            background: #dc2626;
            border-color: #ef4444;
            border-radius: 20px;
        }

        .btn-jump:active {
            background: #22c55e;
            border-color: #4ade80;
        }

        /* Settings Modal */
        .modal {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .modal.hidden { display: none; }

        .modal-box {
            background: #1e293b;
            padding: 20px;
            border-radius: 12px;
            width: 85%;
            max-width: 320px;
            text-align: center;
            border: 1px solid #475569;
        }

        .modal-box select, .modal-box button {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            border-radius: 8px;
            border: none;
            font-size: 16px;
        }

        .modal-box button {
            background: #f59e0b;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="game-wrapper">
        <!-- HUD -->
        <div class="hud">
            <span id="scoreTxt">النقاط: 0</span>
            <button onclick="toggleModal()" style="background:none; border:none; color:#fff; font-size:20px;">⚙️</button>
            <span id="livesTxt">الأرواح: ❤️❤️❤️</span>
        </div>

        <!-- Canvas Game Viewport -->
        <canvas id="gameCanvas" width="400" height="400"></canvas>
    </div>

    <!-- Clear On-Screen Touch Controls -->
    <div class="controls-container">
        <div class="d-pad">
            <div class="btn" id="btnLeft">⬅️</div>
            <div class="btn" id="btnRight">➡️</div>
        </div>
        <div class="btn btn-jump" id="btnJump">⬆️</div>
    </div>

    <!-- Settings Window -->
    <div class="modal hidden" id="modal">
        <div class="modal-box">
            <h3>الإعدادات / Settings</h3>
            <label>اختر اللغة / Language:</label>
            <select id="langSelect" onchange="setLang(this.value)">
                <option value="ar">العربية</option>
                <option value="en">English</option>
                <option value="fr">Français</option>
                <option value="es">Español</option>
                <option value="de">Deutsch</option>
            </select>
            <button onclick="toggleModal()">حفظ وإغلاق</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        let score = 0;
        let lives = 3;

        let player = {
            x: 50, y: 200,
            width: 24, height: 36,
            vx: 0, vy: 0,
            speed: 3.5,
            jumpPower: -10,
            gravity: 0.5,
            grounded: false
        };

        let platforms = [
            { x: 0, y: 360, width: 400, height: 40 },
            { x: 50, y: 280, width: 100, height: 15 },
            { x: 200, y: 220, width: 120, height: 15 },
            { x: 80, y: 150, width: 90, height: 15 }
        ];

        let coins = [
            { x: 100, y: 250, collected: false },
            { x: 250, y: 190, collected: false },
            { x: 120, y: 120, collected: false }
        ];

        let keys = { left: false, right: false, jump: false };

        // Touch Events Handling
        const bindTouch = (id, key) => {
            const el = document.getElementById(id);
            el.addEventListener('touchstart', (e) => { e.preventDefault(); keys[key] = true; });
            el.addEventListener('touchend', (e) => { e.preventDefault(); keys[key] = false; });
            el.addEventListener('mousedown', () => keys[key] = true);
            el.addEventListener('mouseup', () => keys[key] = false);
        };

        bindTouch('btnLeft', 'left');
        bindTouch('btnRight', 'right');
        bindTouch('btnJump', 'jump');

        function toggleModal() {
            document.getElementById('modal').classList.toggle('hidden');
        }

        function update() {
            if (keys.left) player.vx = -player.speed;
            else if (keys.right) player.vx = player.speed;
            else player.vx = 0;

            if (keys.jump && player.grounded) {
                player.vy = player.jumpPower;
                player.grounded = false;
            }

            player.vy += player.gravity;
            player.x += player.vx;
            player.y += player.vy;

            player.grounded = false;

            platforms.forEach(p => {
                if (
                    player.x < p.x + p.width &&
                    player.x + player.width > p.x &&
                    player.y + player.height > p.y &&
                    player.y + player.height < p.y + p.vy + 10
                ) {
                    player.y = p.y - player.height;
                    player.vy = 0;
                    player.grounded = true;
                }
            });

            if (player.x < 0) player.x = 0;
            if (player.x > canvas.width - player.width) player.x = canvas.width - player.width;

            if (player.y > canvas.height) {
                lives--;
                player.x = 50; player.y = 200; player.vy = 0;
                if (lives <= 0) { score = 0; lives = 3; coins.forEach(c => c.collected = false); }
            }

            coins.forEach(c => {
                if (!c.collected && Math.abs(player.x - c.x) < 20 && Math.abs(player.y - c.y) < 20) {
                    c.collected = true;
                    score += 100;
                }
            });

            document.getElementById('scoreTxt').innerText = `النقاط: ${score}`;
            document.getElementById('livesTxt').innerText = `الأرواح: ${'❤️'.repeat(lives)}`;
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw Platforms
            ctx.fillStyle = "#475569";
            platforms.forEach(p => {
                ctx.fillRect(p.x, p.y, p.width, p.height);
                ctx.fillStyle = "#64748b";
                ctx.fillRect(p.x, p.y, p.width, 3);
                ctx.fillStyle = "#475569";
            });

            // Draw Coins
            coins.forEach(c => {
                if (!c.collected) {
                    ctx.beginPath();
                    ctx.arc(c.x, c.y, 8, 0, Math.PI * 2);
                    ctx.fillStyle = "#f59e0b";
                    ctx.fill();
                }
            });

            // Draw Player
            ctx.fillStyle = "#dc2626";
            ctx.fillRect(player.x, player.y, player.width, player.height);
            ctx.fillStyle = "#fde68a";
            ctx.fillRect(player.x + 4, player.y + 4, player.width - 8, 10);
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        loop();
    </script>
</body>
</html>
